services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gridbricks-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: gridbricks-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
